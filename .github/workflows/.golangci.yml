# .golangci.yml
run:
  timeout: 5m
  modules-download-mode: readonly
  skip-dirs:
    - vendor
    - testdata
  skip-files:
    - ".*_test.go"

linters:
  enable:
    - gofmt
    - govet
    - errcheck
    - staticcheck
    - gosimple
    - ineffassign
    - typecheck
    - gosec       # untuk security check
    - misspell    # cek typo
    - revive      # stylistic dan convention
  disable:
    - unused # Sometimes causes false positives with interfaces

linters-settings:
  govet:
    check-shadowing: true
  gofmt:
    simplify: true
  typecheck:
    go: "1.24"
